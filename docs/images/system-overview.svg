<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="510" viewBox="0 0 1200 510" fill="none" role="img" aria-labelledby="title description">
  <title id="title">TravelAI system overview</title>
  <desc id="description">An isometric stack connects the React and TypeScript interface to the Express API, which calls Gemini. Browser local storage keeps trip and profile state on the device.</desc>
